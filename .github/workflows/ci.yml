name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; test the whole range.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  analysis:
    # The audio analysis has dependencies, so it gets its own job. The bare
    # clone job below stays exactly as it was: what it proves is that adding
    # this did not put numpy on the path of anyone reading a preset.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with the analysis extra
        run: pip install -e ".[dev,analysis]"

      - name: Test
        run: python -m pytest -q

      - name: Fingerprint a signal with no plugin and no audio in the repository
        run: |
          python - <<'EOF'
          import numpy as np, soundfile as sf
          rng = np.random.default_rng(7)
          sf.write("/tmp/probe.wav", rng.standard_normal((48000 * 3, 2)) * 0.2, 48000)
          EOF
          python scripts/fingerprint.py /tmp/probe.wav --text
          python scripts/compare_audio.py /tmp/probe.wav /tmp/probe.wav

  fresh-clone:
    # The tools must work with no build step and no preset library of their own:
    # the committed manifest is the contract, and the observed catalog is optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Inspect the bundled preset with no generated catalog
        run: python scripts/show.py samples/Example_Clean_PR12.xml --text

      - name: Generate a preset from a spec
        run: |
          cat > /tmp/spec.json <<'EOF'
          {
            "name": "CI Smoke Test",
            "parameters": [
              {"module": "", "key": "selectedAmp", "value": "SW50R"},
              {"module": "sw50rAmp", "key": "sw50rVolume", "value": 62},
              {"module": "delay", "key": "delayActive", "value": true},
              {"module": "delay", "key": "delayTime",
               "value": {"note": "1/8 dotted", "bpm": 120}}
            ]
          }
          EOF
          python scripts/apply_spec.py \
            --template samples/Example_Clean_PR12.xml \
            --spec /tmp/spec.json --strip-irs --out /tmp/out.xml

      - name: Confirm the result round-trips byte-exact
        run: |
          python - <<'EOF'
          from format.parser import parse
          from format.writer import write
          from format.structured import build
          raw = open("/tmp/out.xml", "rb").read()
          assert write(parse(raw)) == raw, "round-trip mismatch"
          preset = build(parse(raw))
          assert preset.preset_name == "CI Smoke Test"
          assert preset.by_path[("delay", "delayTime")].value == "375"
          print("ok:", preset.preset_name)
          EOF

      - name: Build the observed catalog into a separate data directory
        run: |
          python scripts/build_observed.py --data-dir /tmp/ndsp-data
          test -f /tmp/ndsp-data/packs/morgan/observed.json
          # And nothing was written into the plugin directory itself.
          test ! -f packs/morgan/observed.json

  plugin-validate:
    # Best-effort check against the real CLI. tests/test_plugin_manifest.py is
    # the blocking gate; this catches anything the CLI knows that we don't.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: |
          # Point at plugin.json explicitly: with a marketplace.json present,
          # "." resolves to the marketplace manifest and skills go unchecked.
          claude plugin validate ./.claude-plugin/plugin.json --strict
          claude plugin validate ./.claude-plugin/marketplace.json --strict
