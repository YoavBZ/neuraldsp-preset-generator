[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraldsp-preset-generator"
version = "0.4.0"
description = "Generate, match, and edit Neural DSP amp-sim preset files."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# `pytest-xdist` is here for wall-clock, not for coverage: the suite renders audio
# and runs the real optimiser rather than mocking either, so it is genuinely 7.5
# minutes of work on one core and about a minute spread across eight. Dev-only —
# `tests/test_no_dependencies.py` still holds the line that the tools themselves
# import nothing.
dev = ["pytest>=7.0", "pytest-xdist>=3.5", "pyyaml>=6.0"]
# Measuring audio: analysis/ only. The preset tools above it stay stdlib-only,
# and tests/test_no_dependencies.py holds that line.
analysis = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "pyloudnorm>=0.1"]
# Searching for parameters. The synthetic renderer needs nothing beyond
# [analysis], which is what lets the whole match stack be tested with no plugin.
#
# No `cma`. An earlier version of this comment said "cma arrives with the optimiser in
# M4"; M4 arrived and §2's D4 held instead — `match/search.py` writes the textbook
# (μ/μ_w, λ) CMA-ES out with Hansen's constants in about seventy lines of numpy, which
# is legible, pinned by tests, and one fewer dependency to age.
match = ["neuraldsp-preset-generator[analysis]"]
# Hosting the plugin in-process, for scripts/spike_pedalboard.py. Local and
# macOS-only, like every other plugin-dependent check — never used by CI.
host = ["pedalboard>=0.9"]

# Without this, a flat layout makes setuptools refuse to build: it sees skills/,
# reference/, samples/ and docs/ as candidate packages. Only these are code.
# analysis/ ships in the wheel but imports nothing until it is called, so a
# bare install stays as dependency-free as it has always been.
[tool.setuptools]
packages = ["format", "packs", "analysis", "match", "scripts"]

# The wheel used to contain no non-Python files at all, so an installed (rather
# than editable) copy died on `analysis/loss_profiles.json` with a
# FileNotFoundError, and `packs/*/manifest.json` — the file the whole project
# calls its contract — was missing too.
[tool.setuptools.package-data]
analysis = ["loss_profiles.json"]
packs = ["*/manifest.json", "*/recipes.json", "*/tone.md", "*/eq_basis.json", "*/drive_curve.json", "*/response_atlas_*.json", "*/warm_start_benchmark_*.json"]
scripts = ["au_probe.swift", "au_render.swift", "au_render_server.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Parallel by default. Measured on an 8-core machine, 999 tests: 7m26s
# sequential, 2m52s with `--dist loadfile`, 2m10s with `--dist load`, and
# **1m46s with `--dist worksteal`**, which is what this uses. The spread between
# the three is entirely balance — a handful of tests dominate (the longest is 45s)
# and `loadfile` pins all of `test_search.py`'s 167s to one worker.
#
# Per-test distribution needed two fixtures fixed before it was safe, and the
# claim that it was already safe was wrong: `tests/test_bootstrap.py` and
# `tests/test_apply_spec_cli.py` drafted packs into the repository's own
# `packs/` — ten tests sharing one directory and one pack id — which was
# invisible one test at a time and four to seven failures a run once they ran
# together. Both now draft into a copied plugin tree, as `tests/test_skills.py`
# already did. Everything else was genuinely ready: every other test takes its
# own `tmp_path`, environment mutation goes through `monkeypatch`, and
# `tests/test_skills.py` redirects the fixed paths its documented commands
# mention — `/tmp/spec.json`, `/tmp/au_probe` — into a per-test sandbox.
#
# Note what did *not* catch it: the full suite passed 18 times across six
# configurations, because all twelve of those tests land on one worker when
# 999 are distributed. Only running that file alone shows it.
#
# Pass `-n0` to turn this off, or to run a debugger.
addopts = "-n auto --dist worksteal"
